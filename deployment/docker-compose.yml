
services:
  app:
    build: .
    container_name: ray-verify-app
    ports:
      - "7860:7860"
    environment:
      PORT: 7860
      METRICS_PORT: 8000
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ray-verify-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ray-verify-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-storage:
